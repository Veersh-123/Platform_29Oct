            - generic [ref=e264]: 📝 Acceptance Criteria / Description
            - generic [ref=e265]: ▾
          - generic [ref=e266]: "As an AirBnb website user, I want to search for destination using the search bar, So that I can quickly find relevant hotel room according to the check-in/check-out dates. Destination search Bar : When I navigate to https://www.airbnb.co.in/, The destination search bar should be visible and functional on the website. Then I enter \"Chennai, Tamil Nadu\" as my destination. Check-in, Check-out dates : When I enter check-in date as 01-12-2026, Then I select 04-12-2026 as check-out date. The dates provided should be selected seamlessly. Adding guests : When I click on add guests button, Then the corresponding section should be expanded along with multiple options to select. And I select 3 adults as guests. Acceptance Criteria: Multiple search results should be populated in the screen, When I select first option from the results, wait for the page to load properly. Then validate selected search result should be relevant for provided destination, along with selected check-in/check-out dates and exact guests count."